{% extends "base.html" %}
{% block title %}Cambiar contraseña · Roku Bank{% endblock %}
{% block main %}
  <div class="flow">
  {% if done %}
    <div class="done">
      <div class="check"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Contraseña cambiada</h1>
      <p>Cerramos tus otras sesiones.</p>
      <a class="button" href="/">Volver al inicio</a>
    </div>
  {% else %}
    <h1>Cambiar contraseña</h1>
    <form method="post" action="/clave" class="card form">
      <label for="current">Contraseña actual</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
      <label for="new">Nueva contraseña</label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
      <label for="again">Repetí la nueva</label>
      <input id="again" name="again" type="password" autocomplete="new-password" minlength="8" required>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button class="button" type="submit">Cambiar contraseña</button>
    </form>
    <a class="button ghost" href="/" style="margin-top:.5rem">Cancelar</a>
  {% endif %}
  </div>
{% endblock %}
