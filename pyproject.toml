[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rba-demo-banking"
version = "0.2.0"
description = "Demo-3 relying party: Roku Bank, plus the presenter panel (D-1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Juan Ignacio Gonzalez" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rba-contracts>=0.5.0",
    # Presenter panel reset (D-1): the profile store.
    "redis>=5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rba_demo_banking = [
  "web/templates/*.html",
  "web/static/*",
  # The self-hosted woff2 files; "web/static/*" does not reach into it.
  "web/static/fonts/*",
  "web/static/brand/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
